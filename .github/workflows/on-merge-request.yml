name: PreCheckSecurity

on:
  pull_request:
    branches:
      - 'master'

jobs:
  Security:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3

        - name: Setup Go
          uses: actions/setup-go@v4
          with:
            go-version: 'stable'

        - name: Install checker
          run: go install golang.org/x/vuln/cmd/govulncheck@latest

        - name: Run checker
          run: govulncheck ./...