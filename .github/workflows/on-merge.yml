name: PreCheck

on:
  pull_request:
    branches:
      - 'master'

jobs:
  Security:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3

        - name: Setup Go
          uses: actions/setup-go@v4
          with:
            go-version: 'stable'

        - name: Install checker
          run: go install golang.org/x/vuln/cmd/govulncheck@latest

        - name: Run checker
          run: govulncheck ./...

  CreateTag:
    needs: Security
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        run: echo "RELEASE_VERSION=$(go run . -v | cut -d " " -f 2)" >> $GITHUB_ENV
      
      - name: Create tag v${{ env.RELEASE_VERSION }}
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ env.RELEASE_VERSION }}',
              sha: context.sha
            })