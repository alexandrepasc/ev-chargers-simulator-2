name: PreCheckLinter

on:
  push:
    branches-ignore:
      - 'master'

jobs:

  Linter:
    runs-on: self-hosted
    steps:
        - uses: actions/checkout@v3

        - name: Setup Go
          uses: actions/setup-go@v4
          with:
            go-version: 'stable'

        - name: Install linter
          run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

        - name: Run linter
          run: golangci-lint run ./...