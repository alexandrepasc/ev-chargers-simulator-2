name: PreCheck

on:
  push:

jobs:
  Linter:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3

        - name: Setup Go
          uses: actions/setup-go@v4
          with:
            go-version: 'stable'

        - name: Install linter
          run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

        - name: Run linter
          run: golangci-lint run ./...